# Postgres for E2E runs, locally and in CI: docker compose up -d --wait
# Same major version as Neon. Throwaway data: no volume, so docker compose down wipes it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xd_memories_e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xd_memories_e2e"]
      interval: 2s
      timeout: 2s
      retries: 15
